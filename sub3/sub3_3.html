<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품소개:제품 검색</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://kit.fontawesome.com/486f5e5f33.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/aos.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/sub3_common.css">
    <link rel="stylesheet" href="./css/sub3_3.css">
</head>

<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">내비게이션 바로가기</a>
    </div>
    <div id="wrap">
        <h1 class="hidden">국순당</h1>
        <header id="headerArea">
        </header>

        <div class="visual">
            <img src="./images/hero.jpg" alt="나무 선반 위에 나란히 놓인 여러 빛깔의 전통주 병과 술잔">
            <strong>국순당의<br><span>모든 우리술</span></strong>
            <p>약주부터 막걸리, 되살린 복원주까지<br>국순당이 빚는 술을 한자리에서 만나보세요.</p>
        </div>

        <div class="sub_nav">
            <ul>
                <li><a href="./sub3_1.html">백세주</a></li>
                <li><a href="./sub3_2.html">법고창신</a></li>
                <li><a class="active" href="./sub3_3.html">제품 검색</a></li>
            </ul>
        </div>

        <main id="content">
            <article>
                <div class="title_area">
                    <div class="line_map">
                        HOME &gt; 제품소개 &gt; <strong>제품 검색</strong>
                    </div>
                    <span class="eng">PRODUCT</span>
                    <h2>한 잔의 시작을
                        <br><span>고르는 자리</span>
                    </h2>
                    <p>
                        약주 · 탁주부터 문헌에서 되살린 복원주까지<br>
                        국순당이 빚는 열일곱 가지 술을 만나보실 수 있습니다.
                    </p>
                </div>
                <div class="finder" data-aos="fade-up" data-aos-duration="1500">
                    <label for="title" class="hidden">제품명</label>
                    <input type="text" id="title" placeholder="제품명을 입력해 주세요">
                    <button type="button" id="btn">
                        <span class="material-symbols-outlined">search</span>
                        <span class="hidden">검색</span>
                    </button>
                </div>
                <div class="cate" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200">
                    <ul>
                        <li><button class="on all">전체</button></li>
                        <li><button class="bsj">백세주</button></li>
                        <li><button class="mgl">막걸리</button></li>
                        <li><button class="bg">법고창신</button></li>
                        <li><button class="yd">예담</button></li>
                    </ul>
                </div>
                <p class="count"></p>
                <div class="product_list"></div>
                <div class="modal_box">
                    <div class="popup">
                        <div class="pop_con"></div>
                        <a href="#" class="close_pop">닫기</a>
                    </div>
                </div>
            </article>
        </main>



        <footer id="footerArea">
        </footer>



    </div>
    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html', function () {
            //function(){} -> sub_header.html의 로드가 완료가 되면...
            $.getScript('../js/fullnav.js');  //스크립트 js파을을 동작시키는 메소드
        });

        $('#footerArea').load('../common/sub_footer.html', function () {
            $.getScript('../js/select.js');
        });
    </script>
    <script src="./js/product.js"></script>
    <script src="../js/aos.js"></script>
    <script>
        AOS.init({
            easing: 'ease-in-out-sine'
        });
    </script>
</body>

</html>
